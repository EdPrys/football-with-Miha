# Render blueprint — deploys the API and a managed Postgres, wiring DATABASE_URL.
# Create via Render dashboard: New + → Blueprint → pick this repo.
services:
  - type: web
    name: football-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @app/db exec prisma generate
    startCommand: pnpm --filter @app/db exec prisma migrate deploy && pnpm --filter @app/api exec tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEB_ORIGIN
        sync: false # set to your Vercel URL after the web deploy
      - key: DATABASE_URL
        fromDatabase:
          name: football-db
          property: connectionString

databases:
  - name: football-db
    plan: free
    databaseName: football
    user: football
    region: frankfurt
