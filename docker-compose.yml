services:
  postgres:
    image: postgres:16-alpine
    container_name: football-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football
    ports:
      - '5432:5432'
    volumes:
      - football-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U football -d football']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  football-pg-data:
